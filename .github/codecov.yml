codecov:
  notify:
    require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "0...100"

  status:
    project:
      default:
        # tolerate small drops, e.g. from mechanical refactors that delete a covered line
        threshold: 0.5%
    patch:
      default:
        # report patch coverage, but do not fail a PR that only touches already untested code
        informational: true
    changes: no

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "header, diff"
  behavior: default
  require_changes: no

ignore:
  - "docs"
  - "examples"
  - "utils"
