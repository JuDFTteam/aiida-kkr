name: continuous-integration

on: [push, pull_request]

jobs:

  docs:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Cache python dependencies
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-docs-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          pip-docs-

    - name: Install python dependencies
      run: |
        pip install -e .[docs]

    - name: Install Latex compiler
      run: |
        sudo apt-get install -y latexmk dvipng texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

    - name: Build documentation
      env:
        READTHEDOCS: 'True'
      run: |
        SPHINXOPTS='-nW' make -C docs html


  pre-commit:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Cache python dependencies
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-pre-commit-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          pip-pre-commit-

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install python dependencies
      run: |
        pip install .[pre-commit]
        pip freeze

    - name: Run pre-commit
      run: |
        pre-commit run --all-files || (git status --short; git diff ; exit 1)

    # pylint in pre-commit only checks for errors, here we check for refactoring potential, warnings etc.
    - name: Run pylint strict
      continue-on-error: true
      run: |
        pylint aiida_kkr/


  tests:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        aiida: [{version: 'aiida-core~=2.9.2', name: '2.9'}]
        masci-tools: [{version: 'git+https://github.com/JuDFTteam/masci-tools.git@develop', name: '-masci-develop'}]
        allowed-to-fail: [false]

    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_DB: test_${{ matrix.backend }}
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      rabbitmq:
        # aiida-core's own CI pins this; `rabbitmq:latest` is 4.x, which aiida-core 2.x does not support
        image: rabbitmq:3.8.14-management
        ports:
          - 5672:5672
      slurm:
        image: xenonmiddleware/slurm:17
        ports:
          - 5001:22

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install postgresql graphviz

    - name: Upgrade pip and setuptools
      # It is crucial to update `setuptools` or the installation of `pymatgen` can break
      run: |
        pip install --upgrade pip setuptools wheel
        pip --version

    - name: Install aiida-kkr
      run: |
        pip install ${{ matrix.aiida.version }} ${{ matrix.masci-tools.version }}
        # The PyPI release of aiida-test-cache (0.0.1) pins aiida-core < 2.6 and imports
        # pkg_resources. Its git main branch, never released, supports aiida-core < 3 and does
        # not. Installed before `.[testing]` so pip sees the requirement as already satisfied.
        pip install "aiida-test-cache @ git+https://github.com/aiidateam/aiida-test-cache.git@main"
        pip install .[testing]
        pip freeze

    - name: Migrate AiiDA workflow caches
      run: |
        cd ./tests/
        python migrate_exports.py

    - name: Fake JuKKR installation
      run: |
        cd tests/
        # fake installations of the JuKKR codes
        # and make sure kkr.x etc is found in the PATH (even necessary for the fakes)
        mkdir -p jukkr
        cd jukkr && export PATH="$PWD:$PATH"
        touch kkr.x; touch voronoi.exe; touch kkrflex.exe
        chmod +x kkr.x voronoi.exe kkrflex.exe

    - name: Run pytest
      if: ${{ ! matrix.allowed-to-fail }}
      run: |
        cd tests/
        GITHUB_SUITE=True ./run_all.sh
        ls
        ls ../

    - name: Run pytest allow failure
      if: ${{ matrix.allowed-to-fail }}
      run: |
        cd tests/
        GITHUB_SUITE=True ./run_all.sh || exit 0

    - name: Archive test output artifacts
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-AIIDA__${{ matrix.aiida.name }}__MASCI__${{ matrix.masci-tools.name }}
        path: tests

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./tests/coverage.xml
        fail_ci_if_error: true

  # TEMPORARY -- delete before this branch is merged.
  #
  # Regenerates the pytest-mpl baselines in tests/files/baseline_images/, which were last
  # updated in 2022-11 and no longer match matplotlib 3.11.x. They have to be generated on
  # the CI platform: font rasterization on macOS differs enough that locally generated
  # images are useless here.
  #
  # This is a push-triggered job gated on the branch name rather than a workflow_dispatch
  # one, because GitHub only offers workflow_dispatch for workflows that already carry the
  # trigger on the default branch, and master's ci.yml does not.
  #
  # It generates on all three matrix legs, not just 3.12, so the three sets can be compared
  # against each other before any of them is committed -- that answers "can one baseline set
  # serve all three legs?" in this run instead of in the next CI cycle.
  regenerate-mpl-baselines:

    if: github.ref == 'refs/heads/fix/ci-aiida-2.9'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_DB: test_baselines
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:3.8.14-management
        ports:
          - 5672:5672

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install postgresql graphviz

    - name: Upgrade pip and setuptools
      run: |
        pip install --upgrade pip setuptools wheel
        pip --version

    - name: Install aiida-kkr
      run: |
        pip install aiida-core~=2.9.2 git+https://github.com/JuDFTteam/masci-tools.git@develop
        pip install "aiida-test-cache @ git+https://github.com/aiidateam/aiida-test-cache.git@main"
        pip install .[testing]
        pip freeze

    - name: Migrate AiiDA workflow caches
      run: |
        cd ./tests/
        python migrate_exports.py

    - name: Generate baselines
      run: |
        cd tests/
        export AIIDA_PATH='.'
        mkdir -p '.aiida/access/test_profile'
        python -c "import matplotlib; print('matplotlib', matplotlib.__version__)"
        pytest test_plot_kkr.py --mpl-generate-path=files/baseline_images -p no:warnings

    - name: Upload generated baselines
      uses: actions/upload-artifact@v4
      with:
        name: baseline-images-py${{ matrix.python-version }}
        path: tests/files/baseline_images/
        if-no-files-found: error
